{% extends "admin_dashboard/base.html" %}
{% block content %}
    <h1>Delete Choice</h1>
    <p>Are you sure you want to delete the choice: "{{ choice.text }}"?</p>
    <form method="post">
        {% csrf_token %}
        <button type="submit" class="btn btn-danger">Delete</button>
        <a href="{% url 'admin_list_question' exam_id=choice.question.Examinations.id %}" class="btn btn-secondary">Cancel</a>
    
{% endblock %}
