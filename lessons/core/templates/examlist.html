<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Available Exams</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
    <div class="container py-4">
        <div class="d-flex justify-content-between align-items-center mb-4">
            <h1 class="h3 mb-0">Student: {{ request.user.first_name }} {{ request.user.last_name }}</h1>
            <a href="{% url 'student_logout' %}" class="btn btn-danger">Logout</a>
        </div>

        <div class="card shadow-sm border-0">
            <div class="card-header bg-primary text-white">
                <h2 class="h4 mb-0">Available Exams</h2>
            </div>
            <div class="card-body">
                <div class="table-responsive">
                    <table class="table table-hover align-middle mb-0">
                        <thead class="table-light">
                            <tr>
                                <th>Exam Name</th>
                                <th>Duration</th>
                                <th>Action</th>
                            </tr>
                        </thead>
                        <tbody>
                            {% for exam in exams %}
                                <tr>
                                    <td>{{ exam.title }}</td>
                                    <td>{{ exam.duration_minutes }} minutes</td>
                                    <td>
                                        <a href="{% url 'take_exam' exam.id %}" id="takeExamLink{{ exam.id }}" class="btn btn-primary btn-sm">Take Exam</a>
                                    </td>
                                </tr>
                            {% endfor %}
                        </tbody>
                    </table>
                </div>
            </div>
        </div>
    </div>

    <script>
        const studentSelect = document.getElementById('studentSelect');
        if (studentSelect) {
            studentSelect.addEventListener('change', function() {
                const studentId = this.value;
                const examLinks = document.querySelectorAll('[id^="takeExamLink"]');
                examLinks.forEach(function(link) {
                    link.href = link.href.split('?')[0] + '?student=' + studentId;
                });
            });
        }
    </script>
</body>
</html>
