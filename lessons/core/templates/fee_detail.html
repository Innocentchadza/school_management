<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fee Details</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8f9fa 0%, #eef2ff 100%);
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            font-family: Arial, sans-serif;
        }

        .fee-card {
            max-width: 520px;
            border: none;
            border-radius: 18px;
            box-shadow: 0 12px 40px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }

        .fee-header {
            background: linear-gradient(135deg, #0d6efd, #2563eb);
            color: #fff;
        }
    </style>
</head>
<body>
    <div class="container">
        <div class="card fee-card mx-auto">
            <div class="card-header fee-header text-center py-4">
                <h3 class="mb-0">Fee Summary</h3>
            </div>
            <div class="card-body p-4">
                <div class="d-flex justify-content-between align-items-center mb-3 border-bottom pb-3">
                    <span class="fw-semibold">Remaining Fees</span>
                    <span class="fs-4 fw-bold text-primary">MWK {{ remaining_fees }}</span>
                </div>

                <div class="d-flex justify-content-between align-items-center">
                    <span class="fw-semibold">Payment Status</span>
                    {% if is_fully_paid %}
                        <span class="badge rounded-pill bg-success px-3 py-2">Fully Paid</span>
                    {% else %}
                        <span class="badge rounded-pill bg-warning text-dark px-3 py-2">Not Fully Paid</span>
                    {% endif %}
                </div>
            </div>
        </div>
    </div>
</body>
</html>
