<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Fees</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>Welcome to the Fees Page</h1>
    <a href="{% url 'add_fees' %}" class="btn btn-primary mb-3">Add Fee</a>
    <a href="{% url 'students' %}" class="btn btn-secondary mb-3">View Students</a>
    <a href="{% url 'programs' %}" class="btn btn-success mb-3">View Programs</a>
   <table class="table table-bordered">
       <thead>
           <tr>
               <th>Student</th>
               <th>Amount</th>
               <th>Date</th>
           </tr>
       </thead>
       <tbody>
           {% for fee in fees %}
               <tr>
                   <td>{{ fee.student }}</td>
                   <td>{{ fee.amount }}</td>
                   <td>{{ fee.date }}</td>
               </tr>
           {% endfor %}
       </tbody>
   </table>
</body>
</html>
