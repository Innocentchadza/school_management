<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Programs</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>Welcome to the Programs Page</h1>
    <a href="{% url 'add_program' %}" class="btn btn-primary mb-3">Add Program</a>
    <a href="{% url 'students' %}" class="btn btn-secondary mb-3">View Students</a>
    <a href="{% url 'fees' %}" class="btn btn-success mb-3">View Fees</a>
   <table class="table table-bordered">
       <thead>
           <tr>
               <th>Name</th>
               <th>Description</th>
              
           </tr>
       </thead>
       <tbody>
           {% for program in programs %}
               <tr>
                   <td>{{ program.name }}</td>
                   <td>{{ program.description }}</td>
                  
               </tr>
           {% endfor %}
       </tbody>
   </table>
</body>
</html>
