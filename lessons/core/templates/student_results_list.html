<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Student Results</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background: linear-gradient(135deg, #f8fafc 0%, #eef2ff 100%);
            min-height: 100vh;
            font-family: Arial, sans-serif;
        }

        .results-card {
            max-width: 720px;
            border: none;
            border-radius: 20px;
            box-shadow: 0 12px 35px rgba(15, 23, 42, 0.12);
            overflow: hidden;
        }

        .results-header {
            background: linear-gradient(135deg, #0d6efd, #2563eb);
            color: #fff;
        }

        .student-link {
            text-decoration: none;
            color: #0f172a;
            font-weight: 600;
        }

        .student-link:hover {
            color: #0d6efd;
        }
    </style>
</head>
<body class="d-flex align-items-center justify-content-center py-5">
    <div class="container">
        <div class="card results-card mx-auto">
            <div class="card-header results-header text-center py-4">
                <h2 class="mb-0">Student Resultss</h2>
            </div>
            <div class="card-body p-4">
                {% if students %}
                    <div class="list-group list-group-flush rounded-3">
                        {% for student in students %}
                            <a class="list-group-item list-group-item-action py-3 student-link" href="{% url 'student_results' student.id %}">
                                <div class="d-flex justify-content-between align-items-center">
                                    <span>{{ student.first_name }} {{ student.last_name }}</span>
                                    <span class="badge rounded-pill bg-primary-subtle text-primary">View Results</span>
                                </div>
                            </a>
                        {% endfor %}
                    </div>
                {% else %}
                    <div class="alert alert-info mb-0">No student results available yet.</div>
                {% endif %}
            </div>
        </div>
    </div>
</body>
</html>
