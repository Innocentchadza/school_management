<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>welcome</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <h1>Welcome to the Students Page</h1>
    <a href="{% url 'add_student' %}" class="btn btn-primary mb-3">Add Student</a>
    <a href="{% url 'fees' %}" class="btn btn-secondary mb-3">View Fees</a>
    <a href="{% url 'programs' %}" class="btn btn-success mb-3">View Programs</a>
   <table class="table table-bordered">
       <thead>
           <tr>
               <th>First Name</th>
               <th>Last Name</th>
               <th>Email</th>
               <th>Program</th>
           </tr>
       </thead>
       <tbody>
           {% for student in students %}
               <tr>
                   <td>{{ student.first_name }}</td>
                   <td>{{ student.last_name }}</td>
                   <td>{{ student.email }}</td>
                   <td>{{ student.program }}</td>
               </tr>
           {% endfor %}
       </tbody>
   </table>
</body>
</html>
