<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Take Exam</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body>
    <div class="container mt-5">
        <h1>Take Exam for {{ exam.title }}</h1>
        <p>Duration: {{ exam.duration_minutes }} minutes</p>
        <p>Marks: {{ exam.total_marks }}</p>
        <form method="POST">
            {% csrf_token %}
            {% for form in forms %}
                <div class="mb-3">
                    <label class="form-label">{{ form.selected_choice.label }}</label>
                    {{ form.selected_choice }}
                    {{ form.selected_choice.errors }}
                </div>
            {% endfor %}
            <button type="submit" class="btn btn-primary">Submit Answers</button>
        </form>
    </div>
</body>
</html>
